name: Station compile

on:
  workflow_dispatch:
  push:
    branches:
      - station/bootstrap
    paths:
      - apps/web/**
      - bun.lock
      - bun.lockb
      - package.json
      - .github/workflows/station-compile.yml

concurrency:
  group: station-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Compile Station web
    runs-on: monkci-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Compile web bundle
        working-directory: apps/web
        env:
          MODE: development
          NODE_ENV: production
          VITE_LOCAL_SERVERS: ALL
          VITE_LOCAL_BACKEND_ORIGIN: same-origin
          VITE_AI_EDITING_WORKER_URL: /ai-editing
        run: bun run --bun build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: station-frontend
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
