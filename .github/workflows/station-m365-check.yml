name: Station Microsoft mailbox checks

on:
  workflow_dispatch:
  push:
    branches:
      - station/m365-readonly
    paths:
      - .sqlx/**
      - static_assets/schema.graphql
      - .github/scripts/package-station-mailbox.sh
      - crates/**
      - services/authentication_service/**
      - services/email_service/**
      - services/email_refresh_handler/**
      - apps/web/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/station-m365-check.yml

permissions:
  contents: read

concurrency:
  group: station-m365-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Graph and per-user mailbox backend
    runs-on: monkci-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up repository Nix tools without private caches
        uses: ./.github/actions/setup-nix

      - name: Enter pinned repository development shell
        uses: ./.github/actions/setup-nix-dev-shell

      - name: Record toolchain and resolve workspace metadata
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo metadata --format-version 1 > "$RUNNER_TEMP/station-m365-metadata.json"
          git diff -- Cargo.lock > "$RUNNER_TEMP/station-m365-lock.diff"

      - name: Verify Rust formatting
        run: |
          if ! cargo fmt --all -- --check; then
            cargo fmt --all
            git diff --binary > "$RUNNER_TEMP/station-rustfmt.patch"
            exit 1
          fi

      - name: Verify CHECKED-IN SQLx cache before database setup or regeneration
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER
          CARGO_TARGET_DIR="$RUNNER_TEMP/station-m365-offline-target" SQLX_OFFLINE=true cargo check --locked -p authentication_service -p email_service -p email_refresh_handler -p graphql_email --features email_service/microsoft_graph_readonly

      - name: Build exact-commit mailbox binaries and runtime closure
        run: bash .github/scripts/package-station-mailbox.sh

      - name: Create disposable runner-only test databases
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          just run_dbs -d
          just setup_test_envs
          just setup_macrodb

      - name: Test Graph adapter and Gmail regressions
        run: |
          set -euo pipefail
          unset SQLX_OFFLINE RUSTC_WRAPPER
          cargo test --locked -p email_api_client --features outbound-gmail,outbound-microsoft-graph

      - name: Test Microsoft identity and grant ownership boundaries
        run: |
          set -euo pipefail
          unset SQLX_OFFLINE RUSTC_WRAPPER
          cargo test --locked -p fusionauth microsoft
          cargo test --locked -p microsoft_oauth_grant_db_utils
          cargo test --locked -p email_db_client microsoft
          cargo test --locked -p models_email --lib
          cargo test --locked -p graphql_email provider_test
          cargo test --locked -p email_refresh_handler run_mode_
          cargo test --locked -p email --all-features microsoft
          cargo test --locked -p authentication_service microsoft
          cargo test --locked -p email_service --features microsoft_graph_readonly microsoft
          cargo test --locked -p email_service --features microsoft_graph_readonly mutation_guard

      - name: Type-check native mailbox services against disposable schema
        run: |
          set -euo pipefail
          unset SQLX_OFFLINE RUSTC_WRAPPER
          cargo check --locked -p authentication_service -p email_service -p email_refresh_handler --features email_service/microsoft_graph_readonly

      - name: Generate canonical GraphQL schema artifact
        run: |
          set -euo pipefail
          cargo run --locked -p complete_graph --bin graphql_schema -- "$RUNNER_TEMP/station-schema.graphql"
          cmp static_assets/schema.graphql "$RUNNER_TEMP/station-schema.graphql"

      - name: Upload resolved lockfile and metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-m365-build-evidence
          path: |
            Cargo.lock
            ${{ runner.temp }}/station-rustfmt.patch
            ${{ runner.temp }}/station-schema.graphql
            ${{ runner.temp }}/station-m365-metadata.json
            ${{ runner.temp }}/station-m365-lock.diff
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified mailbox runtime release
        uses: actions/upload-artifact@v4
        with:
          name: station-mailbox-release
          path: ${{ runner.temp }}/station-mailbox-release/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Native inbox UI compile
    runs-on: monkci-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile

      - name: Test changed mailbox UI units
        working-directory: apps/web
        run: |
          set -euo pipefail
          mapfile -d '' -t tests < <(git diff --name-only -z --relative 105ee334 HEAD -- src | grep -zE '\.(test|spec)\.[jt]sx?$')
          test "${#tests[@]}" -gt 0
          bun run test "${tests[@]}"

      - name: Type-check web
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: bun run type-check

      - name: Compile web without deploying or granting mailbox access
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          MODE: development
          NODE_ENV: production
          VITE_LOCAL_SERVERS: ALL
          VITE_LOCAL_BACKEND_ORIGIN: same-origin
          VITE_AI_EDITING_WORKER_URL: /ai-editing
          VITE_ENABLE_MICROSOFT365_EMAIL: 'true'
        run: bun run --bun build

      - name: Upload mailbox-enabled frontend release
        uses: actions/upload-artifact@v4
        with:
          name: station-mailbox-frontend
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
